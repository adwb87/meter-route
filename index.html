<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Meter Route</title>
<meta name="description" content="Plan, optimise and track a day of meter jobs.">
<meta name="theme-color" content="#0d7c91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meter Route">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map"></div>

  <div id="mapbtns">
    <button class="fab" data-act="layers" aria-label="Switch map style"></button>
    <button class="fab" data-act="locate" aria-label="Show my location"></button>
    <button class="fab" data-act="fit" aria-label="Fit all stops"></button>
    <button class="fab fab-accent" data-act="dropmode" aria-label="Drop a pin"></button>
  </div>

  <div id="banner" hidden></div>

  <aside id="sheet" data-snap="half">
    <div id="grab" aria-label="Drag to resize"><span></span></div>
    <div id="sheetBody"></div>
    <nav id="tabs" aria-label="Sections">
      <button data-act="tab" data-tab="route"></button>
      <button data-act="tab" data-tab="add"></button>
      <button data-act="tab" data-tab="history"></button>
    </nav>
  </aside>

  <div id="modalRoot" hidden></div>
  <div id="toast" hidden></div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="core.js"></script>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
